name: Windows Portable Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Python source validation failed" }

      - name: Build main application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath _portable_build --workpath build ZapretPlus.spec
          if (-not (Test-Path "_portable_build\ZapretPlus\ZapretPlus.exe")) { throw "Main ZapretPlus.exe was not created" }
          if (-not (Test-Path "_portable_build\ZapretPlus\assets\icons\house.svg")) { throw "UI SVG assets are missing" }
          if (-not (Test-Path "_portable_build\ZapretPlus\runtime\zapret\bin\winws.exe")) { throw "Zapret runtime is missing" }
          Move-Item "_portable_build\ZapretPlus" "ZapretPlus"

      - name: Build root launcher
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath _launcher_build --workpath build_launcher ZapretPlusLauncher.spec
          if (-not (Test-Path "_launcher_build\ZapretPlus.exe")) { throw "Root launcher was not created" }
          Copy-Item "_launcher_build\ZapretPlus.exe" "ZapretPlus.exe" -Force

      - name: Verify release layout
        shell: pwsh
        run: |
          if (-not (Test-Path "ZapretPlus.exe")) { throw "Root ZapretPlus.exe is missing" }
          if (-not (Test-Path "ZapretPlus\ZapretPlus.exe")) { throw "Application folder is incomplete" }
          if (-not (Test-Path "ZapretPlus\runtime\telegram_proxy\tg_ws_proxy.py")) { throw "TG WS Proxy runtime is missing" }

      - name: Package release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev-${{ github.run_number }}" }
          New-Item -ItemType Directory -Path release_package | Out-Null
          Copy-Item "ZapretPlus.exe" "release_package\ZapretPlus.exe"
          Copy-Item "ZapretPlus" "release_package\ZapretPlus" -Recurse
          Compress-Archive -Path "release_package\*" -DestinationPath "ZapretPlus-$tag-windows-x64.zip" -Force
          $hash = (Get-FileHash "ZapretPlus-$tag-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ZapretPlus-$tag-windows-x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapretPlus-Windows-Portable
          path: |
            ZapretPlus-*-windows-x64.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZapretPlus-*-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
